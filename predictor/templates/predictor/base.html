{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CS2 Match Predictor</title>
    <link rel="stylesheet" href="{% static 'predictor/style.css' %}">
</head>
<body>
    <main class="container">
        <h1>🎯 CS2 Match Predictor</h1>
        <p class="subtitle">Enter five FACEIT nicknames per team. Names must be exact.</p>
        {% block content %}{% endblock %}
        <footer>
            Predictions reflect the skill gap between teams. The model is trained on a
            small dataset, so treat the confidence as a rough estimate.
        </footer>
    </main>
</body>
</html>
